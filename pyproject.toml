[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp-auto-landing"
version = "0.1.0"
description = "Extensible multi-booster kRPC rocket recovery framework"
requires-python = ">=3.12"
dependencies = [
    "krpc>=0.5",
    "numpy",
    "scipy",
    "numba",
    "gfold",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
tofnet = ["onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"recovery" = ["py.typed"]
"recovery.guidance" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: integration tests that require a running KSP + kRPC server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/recovery/control/control_utils.py" = ["ALL"]
"src/recovery/control/dynamics.py" = ["ALL"]
"src/recovery/control/auto_pilot.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "recovery.control.auto_pilot",
    "recovery.control.control_utils",
    "recovery.control.dynamics",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "recovery.guidance._numba"
ignore_errors = true

[[tool.mypy.overrides]]
module = "gfold"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
